<!DOCTYPE html>
<html>
<head>
    <title>Sneho's Birthday</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:'Trebuchet MS', sans-serif;
            background:linear-gradient(135deg,#ffb6d9,#ffcce6,#e6ccff);
            overflow:hidden;
        }

        .balloon{
            position:absolute;
            font-size:50px;
            animation:float 6s infinite ease-in-out;
        }

        .b1{
            left:5%;
            top:10%;
        }

        .b2{
            right:5%;
            top:15%;
            animation-delay:1s;
        }

        .b3{
            left:10%;
            bottom:10%;
            animation-delay:2s;
        }

        .b4{
            right:10%;
            bottom:12%;
            animation-delay:3s;
        }

        @keyframes float{
            0%,100%{
                transform:translateY(0);
            }
            50%{
                transform:translateY(-20px);
            }
        }

        .card{
            background:white;
            padding:50px;
            border-radius:25px;
            text-align:center;
            width:700px;
            box-shadow:0 0 30px rgba(0,0,0,.2);
        }

        h1{
            color:#ff1493;
            font-size:52px;
            margin-bottom:15px;
        }

        h2{
            color:#c71585;
            margin-bottom:20px;
        }

        p{
            font-size:20px;
            line-height:1.8;
            color:#555;
        }

        .emoji{
            font-size:35px;
            margin-bottom:15px;
        }

        a{
            display:inline-block;
            margin-top:25px;
            text-decoration:none;
            background:#ff1493;
            color:white;
            padding:15px 30px;
            border-radius:15px;
            font-size:20px;
            transition:0.3s;
        }

        a:hover{
            transform:scale(1.08);
            background:#ff007f;
        }
    </style>
</head>

<body>

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎀</div>
<div class="balloon b3">💌</div>
<div class="balloon b4">🎈</div>

<div class="card">

    <div class="emoji">✨💗🎂💗✨</div>

    <h1>Happy Birthday Bestie!</h1>

    <h2>🌷 A Little Surprise Just For You 🌷</h2>

    <p>
        Today is all about celebrating the amazing person you are.
        Thank you for all the laughter, memories and endless support.
        You deserve all the happiness in the world. 💕
    </p>
<a href="memories.html">
    🎁 Open Your Surprise 🎁
</a>

</div>

</body>
</html>
