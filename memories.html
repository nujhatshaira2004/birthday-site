<!DOCTYPE html>
<html>
<head>
    <title>Birthday Memories</title>



    <style>
        body{
            margin:0;
            font-family:Arial;
            background:linear-gradient(135deg,#ffb6d9,#ffcce6,#e6ccff);
            text-align:center;
            padding-top:50px;
        }

        .card{
            background: rgb(255 255 255);
            width:800px;
            margin:auto;
            padding:30px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,.2);
        }

        h1{
            color:#ff1493;
            margin-bottom:25px;
        }

        .photos{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
        }

        .photos img{
            width:300px;
            height:350px;
            object-fit:cover;
            border-radius:20px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

       p{
    font-size:20px;
    line-height:1.8;
    color: #f180bd;
}
    </style>
</head>

<body>

<div class="card">

    <h1>💗 My Favorite Person 💗</h1>

    <div class="photos">

    <img src="images/bestie.jpg" alt="Best Friend">
        <img src="images/bestie2.jpg" alt="Best Friend">

    </div>

    <p>
        Every memory with you is special. I am here just a noob coder trying
        something ordinary to make your day a bit special. 💗
        <br>
        I hope you will like it. Thank you for being my best friend.
        May your birthday be as wonderful as you are! 🌷💗
    </p>

</div>

</body>
</html>
